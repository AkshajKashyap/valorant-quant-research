[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-quant-research"
version = "0.1.0"
description = "Leakage-aware research tooling for professional Valorant match outcomes"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
